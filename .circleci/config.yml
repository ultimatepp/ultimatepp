version: 2.1

orbs:
  win: circleci/windows@5.1.1

jobs:
  build-linux:
    docker:
      - image: cimg/base:2026.08
    resource_class: large
    environment:
      NUMBER_OF_CPUS: 4
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install g++ clang git make libgtk-3-dev libnotify-dev libbz2-dev libssl-dev liblz4-dev xdotool xxhash
      - run:
          name: Configure and build
          command: |
            ./configure
            make -f Makefile -j ${NUMBER_OF_CPUS}
            make -f umkMakefile -j ${NUMBER_OF_CPUS}
  build-mac:
    macos:
      xcode: 27.0
    resource_class: m4pro.medium
    environment:
      NUMBER_OF_CPUS: 4
    steps:
      - checkout
      - run:
          name: Install dependencies and configure brew
          command: |
            eval "$(/opt/homebrew/bin/brew shellenv)"
            export HOMEBREW_NO_AUTO_UPDATE=1
            brew install pcre2 xxhash
      - run:
          name: Configure and build
          command: |
            eval "$(/opt/homebrew/bin/brew shellenv)"
            BREW_PREFIX="$(brew --prefix)"
            
            export CPPFLAGS="-I$BREW_PREFIX/include"
            export LDFLAGS="-L$BREW_PREFIX/lib"
            export C_INCLUDE_PATH="$BREW_PREFIX/include"
            export CPLUS_INCLUDE_PATH="$BREW_PREFIX/include"
            export LIBRARY_PATH="$BREW_PREFIX/lib"
            
            ./configure
            make -f umkMakefile -j ${NUMBER_OF_CPUS}
            ./umk ./uppsrc ide CLANG -brs ./theide
  build-windows:
    executor: win/default
    steps:
      - checkout
      - run: New-Item -Path "3p\downloads" -ItemType Directory -Force
      - run: curl.exe -L -o "3p\downloads\umk.7z" "https://github.com/ultimatepp/ultimatepp/releases/download/v2025.1.1/umk-win-17810.7z"
      - run: 7z x 3p\downloads\umk.7z -o3p
      - run: 3p\umk\umk ./uppsrc ide 3p\umk\CLANG.bm -brs +GUI ./theide
      - run: 3p\umk\umk ./uppsrc umk 3p\umk\CLANG.bm -brs ./umk

workflows:
  build-linux:
    jobs:
      - build-linux
  
  build-mac:
    jobs:
      - build-mac

  build-windows:
    jobs:
      - build-windows
